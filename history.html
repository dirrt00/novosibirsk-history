<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>История города — Атлас Приобья</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <nav>
    <a href="index.html">Карта области</a>
    <a href="history.html" class="here">История города</a>
    <a href="fauna.html">Фауна</a>
    <a href="flora.html">Флора</a>
  </nav>
  <div>
    <h1>Атлас Приобья</h1>
    <p>Новосибирская область: карты, история и живая природа края на берегах Оби.</p>
  </div>
</header>
<main>
  <h2>Новосибирск во времени</h2>
  <p class="lead">Двигайте ползунок: места на карте появляются по мере роста города.</p>
  <div class="bar"><button class="btn" id="size" aria-pressed="false">Увеличить карту</button></div>
  <div id="map"></div>
  <section class="filter" aria-live="polite">
    <div class="when" id="yearLabel">2026</div>
    <p class="event" id="eventText"></p>
    <input type="range" id="slider" min="1893" max="2026" step="1" value="2026" aria-label="Год">
    <button class="btn" id="play">Воспроизвести</button>
    <small id="count"></small>
  </section>
</main>
<footer>Данные карты © участники OpenStreetMap</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Координаты примерные: проверьте на карте и поправьте. */
const EVENTS = [
  { year: 1893, text: "Начинается строительство железнодорожного моста через Обь. На берегу появляется посёлок строителей." },
  { year: 1897, text: "Мост через Обь достроен." },
  { year: 1903, text: "Посёлок получает статус города Новониколаевска." },
  { year: 1926, text: "Город переименован в Новосибирск." },
  { year: 1945, text: "Открывается Театр оперы и балета." },
  { year: 1957, text: "Основан Академгородок." },
  { year: 1959, text: "Новосибирская ГЭС завершает строительство." },
  { year: 1986, text: "Открывается метро." },
  { year: 2026, text: "Современный Новосибирск." }
];
const PLACES = [
  { year: 1893, name: "Станция и посёлок у моста", lat: 55.0420, lng: 82.9030, note: "Нынешнее здание вокзала построено в 1940 году." },
  { year: 1897, name: "Железнодорожный мост через Обь", lat: 55.0035, lng: 82.8930, note: "Построен в 1893-1897 годах." },
  { year: 1945, name: "Театр оперы и балета", lat: 55.0302, lng: 82.9230, note: "Открыт в 1945 году." },
  { year: 1957, name: "Академгородок", lat: 54.8480, lng: 83.1050, note: "Научный городок среди соснового леса." },
  { year: 1959, name: "Новосибирская ГЭС", lat: 54.8405, lng: 83.0575, note: "Плотина и Обское водохранилище." },
  { year: 1986, name: "Метро, «Красный проспект»", lat: 55.0287, lng: 82.9215, note: "Первая линия открыта в 1986 году." }
];
const map = L.map('map').setView([55.03, 82.92], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
  attribution: '&copy; участники <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
const markers = PLACES.map(p => L.circleMarker([p.lat, p.lng], { radius: 9, color: '#16324a', weight: 2, fillColor: '#3b7ea1', fillOpacity: .9 })
  .bindPopup('<strong>' + p.name + '</strong><br>' + p.year + '<br>' + p.note));
const slider = document.getElementById('slider');
function update() {
  const y = Number(slider.value);
  document.getElementById('yearLabel').textContent = y;
  let n = 0;
  PLACES.forEach((p, i) => {
    if (p.year <= y) { if (!map.hasLayer(markers[i])) markers[i].addTo(map); n++; }
    else if (map.hasLayer(markers[i])) map.removeLayer(markers[i]);
  });
  document.getElementById('count').textContent = 'Мест на карте: ' + n + ' из ' + PLACES.length;
  let cur = null; EVENTS.forEach(e => { if (e.year <= y) cur = e; });
  document.getElementById('eventText').textContent = cur ? cur.year + ': ' + cur.text : '';
}
slider.addEventListener('input', update);
let timer = null; const btn = document.getElementById('play');
btn.addEventListener('click', () => {
  if (timer) { clearInterval(timer); timer = null; btn.textContent = 'Воспроизвести'; return; }
  if (+slider.value >= +slider.max) slider.value = slider.min;
  btn.textContent = 'Пауза';
  timer = setInterval(() => {
    if (+slider.value >= +slider.max) { clearInterval(timer); timer = null; btn.textContent = 'Воспроизвести'; return; }
    slider.value = +slider.value + 1; update();
  }, 120);
});
const sizeBtn = document.getElementById('size');
sizeBtn.addEventListener('click', () => {
  const big = document.getElementById('map').classList.toggle('big');
  sizeBtn.textContent = big ? 'Уменьшить карту' : 'Увеличить карту';
  sizeBtn.setAttribute('aria-pressed', big);
  map.invalidateSize();
});
update();
</script>
</body>
</html>
